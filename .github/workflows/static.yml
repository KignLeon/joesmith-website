# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      # Improved Build Step:
      # We create a clean directory and copy ONLY the website files.
      # This guarantees no Java source files or hidden configs confuse the build.
      - name: Prepare Build
        run: |
          mkdir _site
          # Copy the main index file
          cp index.html _site/
          # Copy the sub-page folders (clean URLs)
          cp -r about _site/ || echo "No about folder"
          cp -r contact _site/ || echo "No contact folder"
          cp -r experience _site/ || echo "No experience folder"
          # Copy assets if they exist (adjust path if your images are in 'assets' or 'imgs')
          # Based on your files, images seem to be in 'src/main/resources/public/imgs' OR root 'imgs'
          # We try copying from root 'imgs' first, then fallback to src if needed
          cp -r imgs _site/ || cp -r src/main/resources/public/imgs _site/imgs || echo "No images found"
          cp -r css _site/ || cp -r src/main/resources/public/css _site/css || echo "No css found"
          cp -r js _site/ || cp -r src/main/resources/public/js _site/js || echo "No js found"
          
          # Copy standard files
          cp robots.txt _site/ || true
          cp sitemap.xml _site/ || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the clean build folder
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4