# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      # Improved Build Step:
      # 1. Create a build directory
      # 2. Copy EVERYTHING from current directory into it (excluding .git and the build dir itself)
      # 3. Clean up the build directory by removing backend/dev files we don't want published
      - name: Prepare Build
        run: |
          mkdir public_build
          # Copy all files from root to public_build, excluding the build dir itself and .git
          rsync -av --progress . public_build --exclude public_build --exclude .git --exclude .github
          
          # Now, remove the backend/source files from the deployment package
          # We only want the HTML/CSS/JS/Assets
          cd public_build
          rm -rf src target pom.xml dependency-reduced-pom.xml .vscode
          cd ..

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the clean build folder
          path: 'public_build'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4